appId: com.flowforge.desktop
productName: FlowForge
directories:
  output: release
files:
  - dist/**
  - package.json
win:
  target: nsis
  artifactName: FlowForge-${version}-Setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

asarUnpack:
  - node_modules/selenium-webdriver/bin/**
