[package]
name = "cobweb"
version = "0.1.0"
description = "Cobweb local-first browser automation IDE"
edition = "2021"

[lib]
name = "cobweb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cobweb"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["connect"] }
futures-util = "0.3"
url = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
which = "7"

[dev-dependencies]
tempfile = "3"
