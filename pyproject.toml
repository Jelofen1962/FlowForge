[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cobweb"
version = "0.1.0"
description = "Visual browser workflow automation desktop application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7,<7",
  "playwright>=1.45,<2",
  "PyYAML>=6.0,<7",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-qt>=4.4,<5",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "build>=1.2,<2",
  "twine>=5,<7",
]

[project.scripts]
cobweb = "cobweb.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
  "unit: isolated unit tests",
  "integration: tests across multiple CobWeb components",
  "ui: Qt user-interface tests",
  "e2e: end-to-end browser tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["cobweb"]
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.",
]
