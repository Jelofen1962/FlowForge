[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cobweb"
version = "0.1.0"
description = "Visual browser workflow automation desktop application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7,<7",
  "playwright>=1.45,<2",
  "PyYAML>=6.0,<7",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-qt>=4.4,<5",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]

[project.scripts]
cobweb = "cobweb.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
