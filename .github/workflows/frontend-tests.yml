name: CobWeb frontend CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "playwright.config.ts"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - "playwright.config.ts"
      - ".github/workflows/frontend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Install, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate YAML scenario catalogue
        run: npm run test:scenarios

      - name: Run frontend unit tests
        run: npm run test

      - name: Run frontend end-to-end tests
        run: npm run test:e2e

      - name: Build frontend
        run: npm run build

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobweb-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
