name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cobweb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-node22-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-release

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Frontend tests
        run: npm test

      - name: Browser for end-to-end tests
        run: npx playwright install chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Frontend production build
        run: npm run build

      - name: Build Tauri bundles
        run: npm run tauri -- build

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: Cobweb-Windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/release/Cobweb.exe
          if-no-files-found: error
          retention-days: 14
