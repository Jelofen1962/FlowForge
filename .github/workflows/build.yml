name: Build Cobweb (Windows)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build portable Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund --prefer-online

      - name: Run frontend unit tests
        run: npm test

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Type-check and build frontend
        run: npm run build

      - name: Build Windows app and NSIS installer
        run: npm run tauri -- build --bundles nsis

      - name: Prepare portable executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = 'src-tauri/target/release/cobweb.exe'
          if (!(Test-Path $source)) {
            throw "Portable executable was not produced: $source"
          }
          New-Item -ItemType Directory -Force -Path 'dist-portable' | Out-Null
          Copy-Item $source 'dist-portable/Cobweb.exe' -Force
          Get-Item 'dist-portable/Cobweb.exe' | Select-Object Name, Length

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: Cobweb-Portable-Windows-x64
          path: dist-portable/Cobweb.exe
          if-no-files-found: error
          compression-level: 0

      - name: Upload optional NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: Cobweb-Installer-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
