name: Windows Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # npm caching is enabled after a package-lock.json is committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Synchronize package version from GitHub tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run sync:release-version -- ${{ github.ref_name }}
      - name: Verify release configuration
        run: npm run verify:release
      - name: TypeScript check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build Windows NSIS installer
        run: npm run build:win
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: flowforge-windows-release-${{ github.ref_name }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
