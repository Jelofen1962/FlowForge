name: CobWeb Windows Release Exports

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify tests on Windows
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install application and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install Chromium for browser tests
        run: python -m playwright install chromium
      - name: Prepare test report directory
        run: python -c "from pathlib import Path; Path('test-results').mkdir(exist_ok=True)"
      - name: Run all tests with coverage
        run: python -m pytest --cov=cobweb --cov-report=term-missing --junitxml=test-results/junit-windows.xml
      - name: Run critical lint and syntax checks
        run: |
          python -m ruff check src tests --select E4,E7,E9,F
          python -m compileall -q src tests

  build-release:
    needs: [verify]
    name: Build Windows release assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build Python distributions
        run: |
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
      - name: Build Windows desktop executable
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --name CobWeb --paths src src/cobweb/app.py
      - name: Export source snapshot
        shell: pwsh
        run: git archive --format=zip --output=dist/cobweb-source.zip HEAD
      - name: Create GitHub Release and attach Windows exports
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/CobWeb.exe
            dist/*.whl
            dist/*.tar.gz
            dist/cobweb-source.zip
      - name: Upload Windows exports for manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: cobweb-windows-release-exports
          path: |
            dist/CobWeb.exe
            dist/*.whl
            dist/*.tar.gz
            dist/cobweb-source.zip
          if-no-files-found: error
          retention-days: 30
