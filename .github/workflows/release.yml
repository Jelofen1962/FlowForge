name: CobWeb Release Exports

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify tests before release
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install application and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Install Chromium for browser tests
        run: python -m playwright install --with-deps chromium
      - name: Run all tests
        run: python -m pytest --cov=cobweb --cov-report=term-missing
      - name: Run critical lint and syntax checks
        run: |
          python -m ruff check src tests --select E4,E7,E9,F
          python -m compileall -q src tests

  build-release:
    needs: [verify]
    name: Build and publish release assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build wheel and source archive
        run: |
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
          git archive --format=zip --output dist/cobweb-source.zip HEAD
      - name: Create GitHub Release and attach Python exports
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
      - name: Upload build exports for manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: cobweb-release-exports
          path: dist/*
          if-no-files-found: error
          retention-days: 30
