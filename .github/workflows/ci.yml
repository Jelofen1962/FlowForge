name: CobWeb CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cobweb-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pytest-cov

      - name: Install Playwright Chromium and Linux dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright Chromium on Windows
        if: runner.os == 'Windows'
        run: python -m playwright install chromium

      - name: Prepare test report directory
        run: python -c "from pathlib import Path; Path('test-results').mkdir(exist_ok=True)"

      - name: Run complete test suite with coverage and JUnit export
        run: >-
          python -m pytest
          --junitxml=test-results/junit-${{ matrix.os }}.xml
          --cov=cobweb
          --cov-report=term-missing
          --cov-report=xml:coverage-${{ matrix.os }}.xml
          --cov-report=html:htmlcov-${{ matrix.os }}

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-py${{ matrix.python-version }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            test-results/
            coverage-${{ matrix.os }}.xml
            htmlcov-${{ matrix.os }}/

  quality:
    name: Static quality checks
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check critical lint rules
        run: python -m ruff check src tests --select E4,E7,E9,F
      - name: Compile Python files
        run: python -m compileall -q src tests

  build:
    name: Build distributable exports
    runs-on: ubuntu-latest
    needs: [tests, quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Export source snapshot
        run: git archive --format=zip --output dist/cobweb-source.zip HEAD
      - name: Upload Python package exports
        uses: actions/upload-artifact@v4
        with:
          name: cobweb-python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30
