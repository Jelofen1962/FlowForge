name: FlowForge CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # Do not enable setup-node's npm cache until package-lock.json is committed.

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-progress

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Browser integration smoke test
        run: npm run test:browser
        env:
          FLOWFORGE_CHROME_INTEGRATION: '1'

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 45
    needs: quality
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          # Cache requires a committed package-lock.json; intentionally omitted for now.

      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-progress

      - name: Package Windows installer
        run: npm run package:win
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: FlowForge-Windows-Installer
          path: release/*Setup.exe
          if-no-files-found: error
          retention-days: 14
