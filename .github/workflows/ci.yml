name: CobWeb Windows CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cobweb-windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Windows tests (Python 3.12)
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Prepare test report directory
        run: python -c "from pathlib import Path; Path('test-results').mkdir(exist_ok=True)"

      - name: Run complete test suite with coverage and JUnit export
        run: >-
          python -m pytest
          --junitxml=test-results/junit-windows.xml
          --cov=cobweb
          --cov-report=term-missing
          --cov-report=xml:coverage-windows.xml
          --cov-report=html:htmlcov-windows

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-windows-py312
          if-no-files-found: warn
          retention-days: 14
          path: |
            test-results/
            coverage-windows.xml
            htmlcov-windows/

  quality:
    name: Windows static quality checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check critical lint rules
        run: python -m ruff check src tests --select E4,E7,E9,F
      - name: Compile Python files
        run: python -m compileall -q src tests

  build:
    name: Build Windows exports
    runs-on: windows-latest
    needs: [tests, quality]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build Python wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Build Windows desktop executable
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --name CobWeb --paths src src/cobweb/app.py
      - name: Export source snapshot
        shell: pwsh
        run: git archive --format=zip --output=dist/cobweb-source.zip HEAD
      - name: Upload Windows exports
        uses: actions/upload-artifact@v4
        with:
          name: cobweb-windows-exports
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/cobweb-source.zip
            dist/CobWeb.exe
          if-no-files-found: error
          retention-days: 30
